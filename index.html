<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,.28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.22), transparent 35%),
        linear-gradient(135deg, #07111f, #0f172a 60%, #111827);
      color: white;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      box-shadow: 0 10px 30px rgba(99,102,241,.35);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b7c0d1;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #dbe4f0;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      padding: 0 15px;
      color: white;
      background: rgba(255,255,255,.07);
      outline: none;
      transition: .2s ease;
    }

    input::placeholder {
      color: #8190a7;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96,165,250,.12);
    }

    .password-wrap {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #a5b4fc;
      cursor: pointer;
      font-size: 13px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 8px 0 22px;
      font-size: 13px;
      color: #b7c0d1;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: #6366f1;
    }

    a {
      color: #8ab4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      box-shadow: 0 12px 30px rgba(37,99,235,.25);
      transition: transform .15s ease, opacity .15s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #78869d;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.12);
    }

    .google-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      color: #9aa7bb;
      margin-top: 24px;
      font-size: 14px;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      display: none;
      padding: 12px;
      border-radius: 12px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.28);
      color: #bbf7d0;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 26px 20px;
        border-radius: 20px;
      }
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">L</div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="Enter your password" required />
          <button class="toggle-password" type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="login-btn" type="submit">Sign in</button>

      <div class="message" id="message">
        Login form submitted successfully.
      </div>
    </form>

    <div class="divider">OR</div>

    <button class="google-btn" type="button">
      Continue with Google
    </button>

    <p class="footer">
      Don't have an account? <a href="#">Create account</a>
    </p>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    toggle.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "Hide" : "Show";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.style.display = "block";
    });
  </script>
</body>
</html>
