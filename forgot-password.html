<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,.28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.22), transparent 35%),
        linear-gradient(135deg, #07111f, #0f172a 60%, #111827);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    .icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      margin-bottom: 22px;
      font-size: 25px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      box-shadow: 0 10px 30px rgba(99,102,241,.35);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b7c0d1;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #dbe4f0;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: #fff;
      outline: none;
      transition: .2s ease;
    }

    input::placeholder {
      color: #8190a7;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96,165,250,.12);
    }

    .btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      box-shadow: 0 12px 30px rgba(37,99,235,.25);
      transition: transform .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .back {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #9aa7bb;
    }

    a {
      color: #8ab4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.28);
      color: #bbf7d0;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🔐</div>

    <h1>Forgot password?</h1>
    <p class="subtitle">
      No problem. Enter your email address and we'll send you instructions to reset your password.
    </p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <button class="btn" type="submit">Send reset link</button>

      <div class="message" id="message">
        Reset link sent! Please check your email.
      </div>
    </form>

    <p class="back">
      Remember your password?
      <a href="/">Back to login</a>
    </p>
  </main>

  <script>
    const form = document.getElementById("forgotForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (email) {
        message.style.display = "block";
      }
    });
  </script>
</body>
</html>
